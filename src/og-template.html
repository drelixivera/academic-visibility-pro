<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>OG Image — Academic Visibility Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      html, body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      body {
        font-family: 'Inter', system-ui, sans-serif;
        background: #0B1F3A;
        color: #FFFFFF;
        position: relative;
      }

      /* Subtle grid pattern (echoes the hero) */
      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(200, 155, 60, 0.08) 1px, transparent 1px),
          linear-gradient(90deg, rgba(200, 155, 60, 0.08) 1px, transparent 1px);
        background-size: 60px 60px;
        mask-image: radial-gradient(ellipse at 30% 40%, black 30%, transparent 80%);
      }

      /* Gold glow — top right */
      .glow {
        position: absolute;
        width: 500px;
        height: 500px;
        border-radius: 50%;
        background: #C89B3C;
        opacity: 0.18;
        filter: blur(120px);
      }
      .glow-1 { top: -180px; right: -140px; }
      .glow-2 { bottom: -220px; left: -180px; opacity: 0.10; }

      /* Content */
      .wrap {
        position: relative;
        z-index: 10;
        padding: 70px 80px;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      /* Top: brand mark */
      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .logo {
        width: 52px;
        height: 52px;
        border-radius: 50%;
        background: #C89B3C;
        color: #0B1F3A;
        font-family: 'Fraunces', serif;
        font-weight: 600;
        font-size: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .brand-name {
        font-family: 'Fraunces', serif;
        font-size: 24px;
        font-weight: 500;
        letter-spacing: -0.01em;
      }

      /* Middle: main content */
      .main {
        max-width: 960px;
      }

      .eyebrow {
        display: inline-block;
        padding: 9px 18px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        background: rgba(255, 255, 255, 0.06);
        border-radius: 999px;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #C89B3C;
      }

      h1 {
        font-family: 'Fraunces', serif;
        font-weight: 500;
        font-size: 76px;
        line-height: 1.02;
        letter-spacing: -0.02em;
        margin-top: 28px;
      }

      h1 .accent {
        color: #C89B3C;
      }

      /* Bottom: tagline bar */
      .tagline {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-top: 28px;
        border-top: 1px solid rgba(255, 255, 255, 0.12);
      }
      .tagline p {
        font-size: 22px;
        color: rgba(255, 255, 255, 0.75);
        max-width: 700px;
        line-height: 1.4;
      }
      .tagline .domain {
        font-size: 16px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #C89B3C;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>

    <div class="wrap">
      <!-- Top: brand -->
      <div class="brand">
        <div class="logo">A</div>
        <div class="brand-name">Academic Visibility Pro</div>
      </div>

      <!-- Middle: headline -->
      <div class="main">
        <span class="eyebrow">EB1A · O1 · NIW Profile Building</span>
        <h1>
          Build the academic<br />
          profile that gets<br />
          <span class="accent">recognized.</span>
        </h1>
      </div>

      <!-- Bottom: tagline -->
      <div class="tagline">
        <p>Strategic support for researchers, scholars, and professionals.</p>
        <span class="domain">academicvisibilitypro.com</span>
      </div>
    </div>
  </body>
</html>
